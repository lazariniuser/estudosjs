<!DOCTYPE html>
<html lang="pt-br">
<meta charset UTF-8>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="style.css" rel="stylesheet" />
    <title>
        Macarronada
    </title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <body class="text-center container bg-light h-100">
        <div class="container bg-light mb-5 p-5"></div>
            <div class ="text-white text-center col-md-6 mx-auto bg-success rounded p-5">
                <img src="assets/icone.svg" class="avatar img-fluid w-25">
                <div class="p-2" >
                    <form name="intro" method="POST" action="index.html">
                    <h3  class="text-light">Olá! Boas-vindas à calculadora de IMC</h3>
                    <label for="nome_usuario">Seu nome</label>
                    <input type="text" class="btn-light mt-2 form-control" id="nome_usuario" required><br>
                    <label for="altura_usuarioo">Sua altura</label>
                    <input type="number" step="0.1" class="btn-light mt-2 form-control" id="altura_usuario" " required><br>
                    <label for="peso_usuario">Seu peso</label>
                    <input type="number" step="0.1" class="btn-light mt-2 form-control" id="peso_usuario" required><br>
                    <input type="button" class="btn btn-light mb-5" data-bs-toggle="modal" data-bs-target="#exampleModal" value="Confirma" id="confirma">
                    
                
                

        
                </form>
                <div class="modal" tabindex="-1" id="exampleModal">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                    <div class="modal-header">
                                        <h5 class="modal-title">Saiu o resultado do seu IMC!</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body" id="modal-corpo">
                                    
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tentar novamente</button>
                                        <button type="button" class="btn btn-primary">Salvar</button>
                                    </div>
                                    </div>
                                </div>
                                </div>
                    
            </div>
            <script>
                        let modal = document.getElementById("modal-corpo");
                        let nome_user = document.getElementById("nome_usuario");
                        let peso_user = document.getElementById("peso_usuario");
                        let altura_user = document.getElementById("altura_usuario");
                        let aperta = document.getElementById("confirma");
                        
                        
                        function apertaConfirma(){
                    
                            let alt = parseFloat(altura_user.value);
                            let pes = parseFloat(peso_user.value);
                            let res = pes / (alt * alt);
                            let devolutiva = "";

                            if (!isNaN(pes) && !isNaN(alt)){

                            if (res < 10.5 ){
                                devolutiva = "É humanamente impossível o seu IMC ser de "+res+". Talvez você tenha digitado algo errado!";
                            }   
                            if (res < 18.5 && res > 10.5){
                                devolutiva = "Você está Abaixo do peso.";
                            }
                            else if (res >= 18.5 && res<= 24.9){
                                devolutiva = "Você está com o peso ideal.";
                            }
                            else if(res >= 25 && res <= 29.9){
                                devolutiva = "Você está acima do peso.";
                            }
                            else if(res >= 30 && res <= 34.9){
                                devolutiva = "Você está com Obesidade I.";
                            }
                            else if(res >= 35 && res <= 39.9){
                                devolutiva = "Você está com Obesidade II.";
                            }
                            else if(res >= 40){
                                devolutiva = "Você está com Obesidade III.";
                            }
                            else{
                                devolutiva = "Valor inválido.";
                            }
                            }
                            else{
                                devolutiva = "Favor, insira um número!!!";
                            }

                            modal.innerHTML = `<p><h1>Olá, ${nome_user.value}</h1></p>
                                        <p><h2>O resultado do seu IMC é: ${res.toFixed(1)}</h2></p>
                                        <p><h3>${devolutiva}</h3></p>`;
                        }

                        aperta.onclick = apertaConfirma;

                            
                    </script>
        </div>
        <div class="container col-md-6 mt-5 mb-5 mx-auto bg-warning rounded p-5">
            <h1>Como está a sua alimentação?</h1>
            <select class="form-select" >
                <option class="selected" >Como 3x ao dia</option>
            </select>

        </div>
    
    </div>
    <footer class="bg-dark text-center text-light rounded">
        <p>Desenvolvido Por Gabriel Lazarini</p>
    </footer>
    </body>
</head>
</html>
